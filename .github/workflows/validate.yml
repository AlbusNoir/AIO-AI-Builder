name: Validate Public Source

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify exported file hashes
        run: python -B automation/verify_public_manifest.py
      - name: Run public unit tests
        run: python -B run_tests.py
      - name: Check package source contracts
        run: python -B tests/08_package_contract/package_contract.py
      - name: Check V2 static contracts
        run: python -B tests/09_v2_behavioral/run_static_contract.py
      - name: Rebuild and verify four platform adapters
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("PUBLIC_SOURCE_MANIFEST.json"))["stable_release"].removeprefix("v"))')"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          python -B automation/build_releases.py --all --adapter-version "$VERSION"
